<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#057573">
  <title>Daily Quote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--brand:#057573;--brand-dark:#045a58;--brand-soft:#e6f1f1;--brand-border:#b8d4d3;--bg:#ebe9e9;--surface:#fff;--text:#0f172a;--text-muted:#64748b;--danger:#dc2626;--danger-soft:#fef2f2;--radius-btn:14px;--radius-card:20px;--radius-input:12px;--radius-sheet:22px;--radius-icon:10px}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,sans-serif;display:grid;place-items:center;padding:24px}
    .app{width:min(100%,420px);min-height: min(760px,calc(100vh - 48px));background:var(--surface);border-radius:var(--radius-card);padding:28px 24px 24px;display:flex;flex-direction:column}
    header{display:flex;align-items:center;gap:12px;padding-bottom:28px;border-bottom:1px solid #e2e8f0}.mark{width:42px;height:42px;border-radius:14px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)}h1{font-size:19px;line-height:1.2;margin:0;font-weight:800} .eyebrow{margin:3px 0 0;color:var(--text-muted);font-size:13px}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:36px 0}.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--brand);font-weight:800;margin:0 0 20px}.quote-mark{font-size:50px;line-height:.7;color:var(--brand-border);font-weight:800;margin-bottom:18px}.quote{font-size:clamp(25px,7vw,32px);line-height:1.35;font-weight:700;margin:0;letter-spacing:-.02em}.author-row{display:flex;align-items:center;gap:12px;margin-top:28px}.rule{height:2px;width:24px;background:var(--brand);border-radius:2px}.author{margin:0;color:var(--text-muted);font-size:15px;font-weight:700}.actions{display:grid;gap:12px}.button{width:100%;border:0;border-radius:var(--radius-btn);min-height:54px;background:var(--brand);color:white;font:800 16px 'Nunito',system-ui,sans-serif;cursor:pointer;transition:background .15s}.button:hover{background:var(--brand-dark)}.button:focus-visible{outline:3px solid var(--brand-border);outline-offset:3px}.hint{text-align:center;color:var(--text-muted);font-size:12px;margin:14px 0 0}
    @media(max-width:480px){body{padding:0;background:var(--surface)}.app{min-height:100svh;border-radius:0;padding:24px 24px max(24px,env(safe-area-inset-bottom))}}
    @media(prefers-reduced-motion:reduce){.button{transition:none}}
  </style>
</head>
<body>
  <div class="app">
    <header><div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3"/><path d="M8 12h8m-4-4v8"/></svg></div><div><h1>Daily Quote</h1><p class="eyebrow">A little perspective, whenever you need it.</p></div></header>
    <main aria-live="polite" aria-atomic="true"><p class="label">A thought to carry with you</p><div class="quote-mark" aria-hidden="true">“</div><blockquote class="quote" id="quoteText"></blockquote><div class="author-row"><span class="rule" aria-hidden="true"></span><p class="author" id="quoteAuthor"></p></div></main>
    <div class="actions"><button class="button" id="newQuote" type="button">New Quote</button></div><p class="hint">Take a moment. Find your next thought.</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
